[workspace]
resolver = "2"
members = ["crates/resume-core", "crates/resume-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yml = "=0.0.13"
minijinja = { version = "=3.1.0", features = ["json", "serde"] }
clap = { version = "=4.6.10", features = ["derive"] }
anyhow = "=1.0.105"
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["full"] }
wasm-bindgen = "=0.2.130"
